; Validation instance, run directly out of a git checkout.
;
; Nothing here needs copying anywhere. Clone the repo, drop the DNM kubeconfig
; beside this file, and run the manager from the clone:
;
;   git clone git@github.com:PurdueRCAC/dynamic-node-manager.git
;   cd dynamic-node-manager && git checkout dnm-updates
;   cp <the DNM kubeconfig> ./kubeconfig && chmod 600 ./kubeconfig
;   python3 ./dynamic-node-manager.py --mode monitor \
;     --config ./dynamic_node_config.validation.ini --dry-run
;
; Every relative path below is resolved against the directory holding THIS FILE,
; not against your shell's working directory. So the checkout works from any cwd,
; for any user, and under sudo -- none of which is true of ~ paths. Absolute
; paths and $VARS still work if you prefer them.
;
; Two things the checkout layout does mean:
;
;   - ./state and ./kubeconfig land inside a git working tree. Both are listed
;     in .gitignore. Check that .gitignore survived your clone before putting a
;     real credential in ./kubeconfig.
;   - Under sudo, state files get written into the clone as root, and a later
;     unprivileged run will fail to update them. Pick one identity and keep it.
[settings]

; --- isolation -------------------------------------------------------------
; Tags converted nodes so this instance will never revert a production node.
instance_id = validation

; --- logging ---------------------------------------------------------------
; Mirror log output to stderr as well as syslog, since this instance runs in the
; foreground. Syslog is never turned off, so a validation run stays as auditable
; as a production one and `journalctl -t dynamic-node-manager` still shows it.
;
; node-convert's own output is relayed through the same logger, so it appears on
; the console too. Equivalent to --log-console or DNM_LOG_CONSOLE=1; the flag and
; the env var can enable this, but neither they nor this key can disable syslog.
;
; Console output goes to stderr so that --mode test's deployment name is the only
; thing on stdout. To keep a transcript:
;   python3 ./dynamic-node-manager.py --mode monitor \
;     --config ./dynamic_node_config.validation.ini --dry-run 2>&1 | tee run.log
log_console = true

; Mutable state, inside the checkout. Created on first conversion. Sharing
; production's state file is the single fastest way to have the two instances
; fight over nodes.
state_dir = state

; The namespace -> queue map checked in alongside this file. Used in place, not
; copied to /etc.
namespace_queue_paths = namespace_queue_paths.validation.json

; The DNM kubeconfig. Not in the repo -- put it here yourself. This is also
; exported as KUBECONFIG to node-convert, so the manager and the converter's
; kubectl calls address the same cluster.
kubeconfig_path = kubeconfig

; Hard limit on which YuniKorn queues this instance may edit. The manager
; refuses to start if a monitored namespace maps outside this subtree, and
; refuses any capacity write outside it at runtime.
;
; root.anvil.services.dev is an existing leaf, so nothing about the queue tree
; has to change. Note this instance can still only edit this one queue: the
; sibling notebook queue and the services/anvil parents are off limits.
allowed_queue_prefixes = root.anvil.services.dev

; Slurm node type offered to node-convert, and the prefix used to decide which
; newly-joined nodes this instance may claim. Production uses type 'a'; this
; instance is confined to 'b' so a test conversion cannot take a node from the
; production pool.
;
; Check viability without converting anything:
;   node-convert --list --node-type b
node_type = b

; Slurm reservation node-convert parks converted nodes in, passed down as
; RES_NAME. Production uses "k8s"; this instance gets its own.
;
; The reservation is the only thing stopping Slurm scheduling batch jobs onto
; a node that is currently running Kubernetes, and node-convert maintains it by
; read-modify-write of the whole member list, with no locking and no
; equivalent of the resourceVersion precondition used for the ConfigMap. Two
; instances editing one reservation lose each other's nodes. An earlier test
; run did the risky half of this, updating the shared reservation to
; "a[402,874,922],b029,h017" -- b029 is ours, the a-nodes are production's.
;
; Also: an empty reservation is DELETED, so reverting our last node could
; delete production's; and reserved_nodes() hides RES_NAME from the
; eligibility scan, so separate names make each instance skip the other's
; nodes with "reservation <name>" -- a guard independent of node_type.
;
; Nothing to create by hand; node-convert creates it on first conversion and
; deletes it when the last node reverts.
;
; NOTE: only the checkout's node-convert reads RES_NAME. The installed
; /usr/site/rcac/sbin/node-convert hardcodes it, and would ignore this key --
; see node_convert_path at the bottom of this file. Confirm which reservation
; is really being written by watching for node-convert's own
; "Updating reservation <name> nodes to: ..." line in the log.
;
; Unset means "use node-convert's default", as the production config does.
slurm_reservation_name = k8s-dnm-validation

; --- what to watch ---------------------------------------------------------
; Handed over from production, which no longer monitors this namespace.
monitored_namespaces = notebook-test

; --- blast radius ----------------------------------------------------------
; Keep the cap small. Raise it deliberately, one scenario at a time.
;
; This cap is the last backstop against a runaway conversion loop. DNM converts
; whenever pending demand exceeds the headroom it computes from queues.yaml, so
; anything that lets pods stay Pending while capacity looks available on paper
; -- an enclosing queue limit, a taint, unschedulable nodes -- reads as unmet
; demand and triggers another conversion. max_converted_nodes is what stops it.
;
; The first backstop is that the evaluate loop now counts conversions it has
; already queued or that are in flight, so a conversion taking minutes is not
; re-requested on every 30s cycle while queue capacity waits for the node to
; join. Before that, the queue grew one task per cycle for the length of a
; conversion; the tasks were discarded on arrival because convert_node_to_k8s
; re-checks demand, but only after the cap had absorbed them.
max_converted_nodes = 2
reversion_idle_seconds = 300
check_interval_seconds = 30

; NOTE: currently dead. The manager reads this key and initialises
; _next_conversion_allowed_at from it, but nothing ever advances that timestamp,
; so the actuator's cooldown branch is unreachable. Left set so the intent is
; recorded, but do not count it as a brake -- the only things limiting
; conversion rate today are the one-at-a-time actuator, the committed-work
; accounting, and max_converted_nodes.
global_cooldown_seconds = 60

; Ceiling on the orderly-shutdown wait. On Ctrl-C the manager starts nothing new
; and waits this long for a conversion or reversion already running to finish,
; because killing one mid-flight is what strands a node. Running in the
; foreground there is no systemd timeout to collide with, so the 10 minute
; default is fine here; a systemd-managed instance needs TimeoutStopSec set to
; at least this value or systemd SIGKILLs first and the wait is pointless.
shutdown_grace_seconds = 600

; --- node sizing -----------------------------------------------------------
; Must match the real capacity of the test partition's nodes, otherwise the
; YuniKorn capacity arithmetic drifts from reality.
node_cpu_capacity = 128
node_memory_capacity = 256G

; --- YuniKorn --------------------------------------------------------------
; Same shared ConfigMap as production. The allowlist above, plus the
; resourceVersion precondition on writes, is what makes that safe.
yunikorn_cm_namespace = yunikorn
yunikorn_cm_name = yunikorn-configs
yunikorn_queue_annotation = yunikorn.apache.org/queue

; --- pending pod defaults --------------------------------------------------
default_cpu_request_m = 1000
default_mem_request = 2Gi

; --- preemption ------------------------------------------------------------
; Leave off until the basic scale-out and revert paths are proven.
allow_preempt = false

; --- node-convert ----------------------------------------------------------
; Unset means the installed converter at /usr/site/rcac/sbin/node-convert.
;
; This is effectively forced now, because only the checkout's copy reads
; RES_NAME. With the installed converter, slurm_reservation_name above is
; ignored and this instance edits production's "k8s" reservation instead --
; nothing stops that, so if you change this line, drop that key too and know
; you are sharing a reservation with production.
;
; The other difference, unchanged: on the dnm-updates branch the checkout's
; node-convert is NOT the same program as the installed one -- it carries the
; backfill preemption work. Testing the deployed converter is the conservative
; choice; testing the branch's converter is what validates the change actually
; being shipped. The reservation split points the same way, so:
node_convert_path = node-convert
