; Validation instance, run out of a home directory rather than /etc.
;
; Layout this assumes:
;   ~/dnm-validation/dynamic_node_config.ini      <- this file
;   ~/dnm-validation/namespace_queue_paths.json
;   ~/dnm-validation/kubeconfig                   <- the DNM kubeconfig
;   ~/dnm-validation/state/converted_nodes.json   <- created on first conversion
;
; Run it foreground, no systemd:
;   python3 /usr/site/rcac/sbin/dynamic-node-manager.py --mode monitor \
;     --config ~/dnm-validation/dynamic_node_config.ini --dry-run
;
; ~ and $VARS are expanded in every path key below.
;
; WARNING about sudo: `~` is expanded by this process, not by your shell, so
; under `sudo` it becomes /root and every path here silently moves. If you will
; ever run this under sudo -- and a real conversion probably needs to, since
; node-convert drains nodes and runs racadm -- replace the ~ paths below with
; absolute ones, or use `sudo -E` with $HOME set. Absolute is safer.
[settings]

; --- isolation -------------------------------------------------------------
; Tags converted nodes so this instance will never revert a production node.
instance_id = validation

; Separate home for converted_nodes.json. Sharing production's state file is
; the single fastest way to have the two instances fight over nodes.
state_dir = ~/dnm-validation/state

; Its own namespace -> queue map.
namespace_queue_paths = ~/dnm-validation/namespace_queue_paths.json

; The DNM kubeconfig. This is also exported as KUBECONFIG to node-convert, so
; the manager and the converter's kubectl calls address the same cluster.
kubeconfig_path = ~/dnm-validation/kubeconfig

; Hard limit on which YuniKorn queues this instance may edit. The manager
; refuses to start if a monitored namespace maps outside this subtree, and
; refuses any capacity write outside it at runtime.
;
; root.anvil.services.dev is an existing leaf, so nothing about the queue tree
; has to change. Note this instance can still only edit this one queue: the
; sibling notebook queue and the services/anvil parents are off limits.
allowed_queue_prefixes = root.anvil.services.dev

; Slurm node type offered to node-convert, and the prefix used to decide which
; newly-joined nodes this instance may claim. Production uses type 'a'; this
; instance is confined to 'b' so a test conversion cannot take a node from the
; production pool.
;
; Check viability without converting anything:
;   node-convert --list --node-type b
node_type = b

; --- what to watch ---------------------------------------------------------
; Handed over from production, which no longer monitors this namespace.
monitored_namespaces = notebook-test

; --- blast radius ----------------------------------------------------------
; Keep the cap small. Raise it deliberately, one scenario at a time.
;
; This cap is the backstop against a runaway conversion loop. DNM converts
; whenever pending demand exceeds the headroom it computes from queues.yaml, so
; anything that lets pods stay Pending while capacity looks available on paper
; -- an enclosing queue limit, a taint, unschedulable nodes -- reads as unmet
; demand and triggers another conversion. max_converted_nodes is what stops it.
max_converted_nodes = 2
reversion_idle_seconds = 300
check_interval_seconds = 30
global_cooldown_seconds = 60

; --- node sizing -----------------------------------------------------------
; Must match the real capacity of the test partition's nodes, otherwise the
; YuniKorn capacity arithmetic drifts from reality.
node_cpu_capacity = 128
node_memory_capacity = 256G

; --- YuniKorn --------------------------------------------------------------
; Same shared ConfigMap as production. The allowlist above, plus the
; resourceVersion precondition on writes, is what makes that safe.
yunikorn_cm_namespace = yunikorn
yunikorn_cm_name = yunikorn-configs
yunikorn_queue_annotation = yunikorn.apache.org/queue

; --- pending pod defaults --------------------------------------------------
default_cpu_request_m = 1000
default_mem_request = 2Gi

; --- preemption ------------------------------------------------------------
; Leave off until the basic scale-out and revert paths are proven.
allow_preempt = false

; The node-convert binary. Override only if you are testing a modified copy.
; node_convert_path = /usr/site/rcac/sbin/node-convert
